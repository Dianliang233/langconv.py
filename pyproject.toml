[project]
name = "langconv"
version = "0.4.0"
description = "A Python library for conversion between Traditional and Simplified Chinese, inspired by MediaWiki's LanguageConverter."
authors = [{ name = "Dianliang233", email = "me@dian.fyi" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["attrs>=26.1.0,<27", "iso639-lang>=2.6.3,<3"]

[project.urls]
Repository = "https://github.com/Dianliang233/langconv.py"

[dependency-groups]
dev = [
    "autopep8>=2.3.2,<3",
    "ruff>=0.17.0,<0.18",
    "pytest>=9.1.1,<10",
    "pytest-benchmark>=5.3.0,<6",
    "pytest-cov>=7.1.0,<8",
    "snakeviz>=2.2.2,<3",
    "pre-commit>=4.7.0,<5",
]

[tool.uv]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
reportUndefinedVariable = 'error'
reportUnusedVariable = 'none'
typeCheckingMode = 'strict'

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "SIM", "PL"]
ignore = ["E501", "S101"]
exclude = ["typings/**/*"]

[tool.pytest]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = [
    "--cov",
    "langconv",
    "--cov-report",
    "xml",
    "--cov-report",
    "term",
    "-m",
    "not slow",
]
